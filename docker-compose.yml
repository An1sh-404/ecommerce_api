# Allows you to bring multiple different containers running different services together
# in a single environment using a single configuration file.
services:
  web:
    build: .
    container_name: django_app
    ports:
      - 8000:8000
    volumes:
      - .:/app
    
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env


  db:
    image: postgres:17
    container_name: postgres_db
    volumes:
      - postgres_db:/var/lib/postgresql/data/
    environment:
       POSTGRES_DB: ${POSTGRES_DB}
       POSTGRES_USER: ${POSTGRES_USER}
       POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  postgres_db: